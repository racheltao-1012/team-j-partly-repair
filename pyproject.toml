[project]
name = "team-j-partly-repair"
version = "0.3.0"
description = "Photo-to-parts collision inspection workflow with technician verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pillow>=10.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
